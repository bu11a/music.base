<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080A10">
  <title>music.base</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24">
      <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
      <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/>
      <path d="m21 21-4.3-4.3"/>
    </symbol>
    <symbol id="i-library" viewBox="0 0 24 24">
      <path d="m16 6 4 14"/>
      <path d="M12 6v14"/>
      <path d="M8 8v12"/>
      <path d="M4 4v16"/>
    </symbol>
    <symbol id="i-list" viewBox="0 0 24 24">
      <path d="M8 6h13"/>
      <path d="M8 12h13"/>
      <path d="M8 18h13"/>
      <path d="M3 6h.01"/>
      <path d="M3 12h.01"/>
      <path d="M3 18h.01"/>
    </symbol>
    <symbol id="i-heart" viewBox="0 0 24 24">
      <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 24 24">
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
      <path d="M3 3v5h5"/>
      <path d="M12 7v5l4 2"/>
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24">
      <polygon points="6 3 20 12 6 21 6 3"/>
    </symbol>
    <symbol id="i-pause" viewBox="0 0 24 24">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </symbol>
    <symbol id="i-prev" viewBox="0 0 24 24">
      <polygon points="19 20 9 12 19 4 19 20"/>
      <line x1="5" x2="5" y1="19" y2="5"/>
    </symbol>
    <symbol id="i-next" viewBox="0 0 24 24">
      <polygon points="5 4 15 12 5 20 5 4"/>
      <line x1="19" x2="19" y1="5" y2="19"/>
    </symbol>
    <symbol id="i-volume" viewBox="0 0 24 24">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6"/>
    </symbol>
  </svg>

  <div class="app">
    <aside class="sidebar" aria-label="Primary">
      <button class="logo" type="button" data-route="home">
        <span class="logo-mark" aria-hidden="true"></span>
        <span class="logo-word">music.base</span>
      </button>
      <nav class="menu" aria-label="Browse">
        <button class="nav-btn is-active" type="button" data-route="home">
          <svg class="icon"><use href="#i-home"></use></svg>
          <span>Home</span>
        </button>
        <button class="nav-btn" type="button" data-route="search">
          <svg class="icon"><use href="#i-search"></use></svg>
          <span>Search</span>
        </button>
        <button class="nav-btn" type="button" data-route="library">
          <svg class="icon"><use href="#i-library"></use></svg>
          <span>Your Library</span>
        </button>
      </nav>
      <div class="collection">
        <p class="menu-label">Collection</p>
        <button class="nav-btn" type="button" data-route="playlists">
          <svg class="icon"><use href="#i-list"></use></svg>
          <span>Playlists</span>
        </button>
        <button class="nav-btn" type="button" data-route="liked">
          <svg class="icon"><use href="#i-heart"></use></svg>
          <span>Liked Songs</span>
        </button>
        <button class="nav-btn" type="button" data-route="recent">
          <svg class="icon"><use href="#i-clock"></use></svg>
          <span>Recently Played</span>
        </button>
      </div>
      <p class="credit">Kevin MacLeod (incompetech.com), CC BY 4.0. SoundHelix examples.</p>
    </aside>

    <main id="main" class="main" tabindex="-1"></main>

    <footer class="player" aria-label="Player">
      <div class="player-track">
        <button class="cover-btn" id="open-full" type="button" aria-label="Open player">
          <span class="art tone-0" id="player-art"><span id="player-initials">mb</span></span>
        </button>
        <div class="player-meta">
          <strong id="player-title">music.base</strong>
          <span id="player-artist">Choose a track</span>
        </div>
      </div>
      <button class="like-btn" id="player-like" type="button" aria-pressed="false" aria-label="Save to liked songs" disabled>
        <svg class="icon"><use href="#i-heart"></use></svg>
      </button>
      <div class="player-center">
        <div class="transport">
          <button class="icon-btn" id="prev-btn" type="button" aria-label="Previous track">
            <svg class="icon"><use href="#i-prev"></use></svg>
          </button>
          <button class="play-btn" id="play-btn" type="button" aria-label="Play" aria-pressed="false">
            <svg class="icon icon-fill" id="play-icon"><use href="#i-play"></use></svg>
          </button>
          <button class="icon-btn" id="next-btn" type="button" aria-label="Next track">
            <svg class="icon"><use href="#i-next"></use></svg>
          </button>
        </div>
        <div class="timeline">
          <span id="time-current">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Playback position" aria-valuetext="0:00">
          <span id="time-total">0:00</span>
        </div>
      </div>
      <label class="volume">
        <svg class="icon"><use href="#i-volume"></use></svg>
        <span class="sr-only">Volume</span>
        <input id="volume" type="range" min="0" max="100" value="80" aria-label="Volume" aria-valuetext="80 percent">
      </label>
    </footer>
  </div>

  <section class="full-player" id="full-player" data-tone="0" hidden>
    <button class="close-full" id="close-full" type="button">
      <svg class="icon"><use href="#i-close"></use></svg>
      Close player
    </button>
    <div class="full-layout">
      <div class="art art-xl tone-0" id="full-art"><span id="full-initials">mb</span></div>
      <div class="full-copy">
        <p class="eyebrow">Now playing</p>
        <h2 id="full-title">music.base</h2>
        <p id="full-artist">Choose a track</p>
        <div class="wave" id="wave" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="timeline full-timeline">
          <span id="full-current">0:00</span>
          <input id="full-seek" type="range" min="0" max="1000" value="0" aria-label="Playback position" aria-valuetext="0:00">
          <span id="full-total">0:00</span>
        </div>
        <div class="transport full-transport">
          <button class="icon-btn" id="full-prev" type="button" aria-label="Previous track">
            <svg class="icon"><use href="#i-prev"></use></svg>
          </button>
          <button class="play-btn play-btn-lg" id="full-play" type="button" aria-label="Play" aria-pressed="false">
            <svg class="icon icon-fill" id="full-play-icon"><use href="#i-play"></use></svg>
          </button>
          <button class="icon-btn" id="full-next" type="button" aria-label="Next track">
            <svg class="icon"><use href="#i-next"></use></svg>
          </button>
        </div>
        <label class="volume full-volume">
          <svg class="icon"><use href="#i-volume"></use></svg>
          <span class="sr-only">Volume</span>
          <input id="full-volume" type="range" min="0" max="100" value="80" aria-label="Volume" aria-valuetext="80 percent">
        </label>
      </div>
    </div>
  </section>

  <script src="data.js"></script>
  <script src="player.js"></script>
  <script src="main.js"></script>
</body>
</html>
